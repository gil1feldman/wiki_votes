<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>הצבעות מחיקה בויקיפדיה</title>
  <style>
    body { font-family: Arial, sans-serif; direction: rtl; padding: 20px; background-color: #f9f9f9; }
    h1 { text-align: center; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; background-color: white; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
    th { background-color: #eaeaea; }
    a { color: #0077cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
    #status { text-align: center; font-size: 1.2em; }
  </style>
</head>
<body>
  <h1>הצבעות מחיקה פעילות בויקיפדיה</h1>
  <div id="status">טוען נתונים...</div>
  <table id="results" style="display:none">
    <thead>
      <tr>
        <th>שם הערך</th>
        <th>מצביעים למחוק</th>
        <th>מצביעים להשאיר</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function fetchWikitext() {
      const apiUrl = "https://he.wikipedia.org/w/api.php?action=query&prop=revisions&titles=ויקיפדיה:רשימת_מועמדים_למחיקה&rvprop=content&formatversion=2&format=json&origin=*";
      const response = await fetch(apiUrl);
      const json = await response.json();
      const content = json.query.pages[0].revisions[0].content;
      return content;
    }

    function parseVotes(wikitext) {
      const results = [];
      const sections = wikitext.split('==').filter(s => s.includes("'''")); // חותכים לפי כותרות דיונים

      for (let section of sections) {
        const lines = section.split('\n');
        const titleLine = lines.find(line => line.includes("'''"));
        if (!titleLine) continue;

        const match = titleLine.match(/'''([^']+)'''/);
        const title = match ? match[1].trim() : null;
        if (!title) continue;

        const support = (section.match(/{{למחוק}}|[^א-ת]למחוק[^א-ת]/g) || []).length;
        const oppose = (section.match(/{{להשאיר}}|{{לשמור}}|[^א-ת]להשאיר[^א-ת]|[^א-ת]לשמור[^א-ת]/g) || []).length;

        if (support + oppose > 0) {
          results.push({
            title,
            pageUrl: `https://he.wikipedia.org/wiki/${encodeURIComponent(title.replace(/ /g, '_'))}`,
            support,
            oppose
          });
        }
      }

      return results;
    }

    async function run() {
      try {
        const wikitext = await fetchWikitext();
        const data = parseVotes(wikitext);

        const table = document.getElementById('results');
        const tbody = table.querySelector('tbody');
        const status = document.getElementById('status');
        status.style.display = 'none';
        table.style.display = 'table';

        data.forEach(row => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><a href="${row.pageUrl}" target="_blank">${row.title}</a></td>
            <td>${row.support}</td>
            <td>${row.oppose}</td>
          `;
          tbody.appendChild(tr);
        });

        if (data.length === 0) {
          status.style.display = 'block';
          status.innerText = 'לא נמצאו הצבעות פעילות כרגע.';
          table.style.display = 'none';
        }

      } catch (error) {
        document.getElementById('status').innerText = 'אירעה שגיאה בעת טעינת הנתונים.';
        console.error(error);
      }
    }

    run();
  </script>
</body>
</html>
