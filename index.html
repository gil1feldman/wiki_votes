<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>רשימת הצבעות מחיקה</title>
  <style>
    body {
      direction: rtl;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 5px 0;
    }
    a {
      text-decoration: none;
      color: #0066cc;
    }
    a:hover {
      text-decoration: underline;
    }
    #status {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>הצבעות מחיקה פעילות בויקיפדיה</h1>
  <div id="status">טוען את עץ הקטגוריות...</div>
  <ul id="vote-list"></ul>

  <script>
    async function fetchTreeHTML() {
      const url = "https://corsproxy.io/?" + encodeURIComponent("https://he.wikipedia.org/w/index.php?title=מיוחד:עץ_קטגוריות&target=ויקיפדיה:_הצבעות_מחיקה_ושחזור&mode=all");
      const res = await fetch(url);
      const html = await res.text();
      const parser = new DOMParser();
      return parser.parseFromString(html, "text/html");
    }

    async function showVotesFromTree() {
      const status = document.getElementById("status");
      const list = document.getElementById("vote-list");

      try {
        const doc = await fetchTreeHTML();
        const links = [...doc.querySelectorAll("a")].filter(a =>
          a.href.includes("/wiki/ויקיפדיה:רשימת_מועמדים_למחיקה/")
        );

        if (links.length === 0) {
          status.textContent = "לא נמצאו הצבעות מחיקה.";
          return;
        }

        status.style.display = "none";

        for (const a of links) {
          const li = document.createElement("li");
          li.innerHTML = `<a href="https://he.wikipedia.org${a.getAttribute('href')}" target="_blank">${a.textContent}</a>`;
          list.appendChild(li);
        }

      } catch (err) {
        console.error(err);
        status.textContent = "אירעה שגיאה בטעינת הדף.";
      }
    }

    showVotesFromTree();
  </script>
</body>
</html>
