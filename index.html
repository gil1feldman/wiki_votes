<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>הצבעות מחיקה בויקיפדיה</title>
  <style>
    body {
      direction: rtl;
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
    }
    h1 {
      text-align: center;
    }
    #status {
      text-align: center;
      margin-top: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #e0e0e0;
    }
    tr.majority-delete {
      background-color: #ffe5e5;
    }
    tr.majority-keep {
      background-color: #e5ffe5;
    }
    a {
      color: #0066cc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>הצבעות מחיקה פעילות בויקיפדיה</h1>
  <div id="status">טוען נתונים...</div>
  <table id="results" style="display:none">
    <thead>
      <tr>
        <th>שם הערך</th>
        <th>מצביעים למחוק</th>
        <th>מצביעים להשאיר</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const apiBase = "https://he.wikipedia.org/w/api.php?origin=*";

    async function fetchCategoryPages(limit = 20) {
      const url = `${apiBase}&action=query&list=categorymembers&cmtitle=קטגוריה:ויקיפדיה:_הצבעות_מחיקה_ושחזור&cmlimit=${limit}&format=json`;
      const res = await fetch(url);
      const data = await res.json();
      return data.query.categorymembers;
    }

    async function fetchWikitext(title) {
      const url = `${apiBase}&action=query&prop=revisions&titles=${encodeURIComponent(title)}&rvslots=main&rvprop=content&formatversion=2&format=json`;
      const res = await fetch(url);
      const data = await res.json();
      const page = data.query.pages[0];
      return page.revisions[0].slots.main.content;
    }

    function extractVotingSection(wikitext) {
      const start = wikitext.indexOf('== הצבעה ==');
      if (start === -1) return null;

      const rest = wikitext.slice(start + '== הצבעה =='.length);
      const endMatch = rest.match(/==\s.*?==/);
      const end = endMatch ? rest.indexOf(endMatch[0]) : rest.length;

      return rest.slice(0, end).trim();
    }

    function countVotes(votingText) {
      const support = (votingText.match(/{{למחוק}}/g) || []).length;
      const oppose = (votingText.match(/{{להשאיר}}|{{לשמור}}/g) || []).length;
      return { support, oppose };
    }

    async function run() {
      const status = document.getElementById("status");
      const table = document.getElementById("results");
      const tbody = table.querySelector("tbody");

      try {
        const pages = await fetchCategoryPages();
        for (const page of pages) {
          const wikitext = await fetchWikitext(page.title);
          const votingSection = extractVotingSection(wikitext);
          if (!votingSection) continue;

          const { support, oppose } = countVotes(votingSection);
          if (support + oppose === 0) continue;

          const displayTitle = page.title.replace("ויקיפדיה:רשימת מועמדים למחיקה/", "");
          const tr = document.createElement("tr");
          if (support > oppose) {
            tr.classList.add("majority-delete");
          } else if (oppose > support) {
            tr.classList.add("majority-keep");
          }

          tr.innerHTML = `
            <td><a href="https://he.wikipedia.org/wiki/${encodeURIComponent(page.title)}" target="_blank">${displayTitle}</a></td>
            <td>${support}</td>
            <td>${oppose}</td>
          `;
          tbody.appendChild(tr);
        }

        if (tbody.children.length > 0) {
          status.style.display = "none";
          table.style.display = "table";
        } else {
          status.textContent = "לא נמצאו הצבעות פעילות.";
        }

      } catch (error) {
        status.textContent = "אירעה שגיאה בטעינת הנתונים.";
        console.error(error);
      }
    }

    run();
  </script>
</body>
</html>
