<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>הצבעות מחיקה פעילות</title>
  <style>
    body {
      direction: rtl;
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f8f8f8;
    }
    h1 {
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #e0e0e0;
    }
    a {
      color: #0077cc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    #status {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>הצבעות מחיקה פעילות בויקיפדיה</h1>
  <div id="status">טוען נתונים...</div>
  <table id="results" style="display:none">
    <thead>
      <tr>
        <th>שם הערך</th>
        <th>מצביעים למחוק</th>
        <th>מצביעים להשאיר</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const categoryTitle = "קטגוריה:ויקיפדיה: הצבעות מחיקה ושחזור";
    const apiBase = "https://he.wikipedia.org/w/api.php?origin=*";

    async function fetchCategoryPages(limit = 20) {
      const res = await fetch(`${apiBase}&action=query&list=categorymembers&cmtitle=${encodeURIComponent(categoryTitle)}&cmlimit=${limit}&format=json`);
      const data = await res.json();
      return data.query.categorymembers;
    }

    async function fetchWikitext(title) {
      const res = await fetch(`${apiBase}&action=query&prop=revisions&titles=${encodeURIComponent(title)}&rvprop=content&formatversion=2&format=json`);
      const data = await res.json();
      return data.query.pages[0].revisions[0].content;
    }

    function countVotes(wikitext) {
      const support = (wikitext.match(/{{למחוק}}/g) || []).length;
      const oppose = (wikitext.match(/{{להשאיר}}|{{לשמור}}/g) || []).length;
      return { support, oppose };
    }

    async function loadVotes() {
      const status = document.getElementById("status");
      const table = document.getElementById("results");
      const tbody = table.querySelector("tbody");

      try {
        const pages = await fetchCategoryPages(20);
        for (const page of pages) {
          const wikitext = await fetchWikitext(page.title);
          const { support, oppose } = countVotes(wikitext);

          if (support + oppose === 0) continue; // דלג אם אין הצבעות בכלל

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><a href="https://he.wikipedia.org/wiki/${encodeURIComponent(page.title)}" target="_blank">${page.title.replace("ויקיפדיה:רשימת מועמדים למחיקה/", "")}</a></td>
            <td>${support}</td>
            <td>${oppose}</td>
          `;
          tbody.appendChild(tr);
        }

        status.style.display = "none";
        table.style.display = "table";

        if (tbody.children.length === 0) {
          status.innerText = "לא נמצאו הצבעות פעילות.";
          status.style.display = "block";
        }

      } catch (error) {
        console.error(error);
        status.innerText = "אירעה שגיאה בעת טעינת הנתונים.";
      }
    }

    loadVotes();
  </script>
</body>
</html>
